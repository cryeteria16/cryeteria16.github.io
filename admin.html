<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Admin Studio | The Lair</title>
<link id="dynamic-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { 
    --bg: #0A0A0A; 
    --ink: #FFFFFF; 
    --ink-soft: rgba(255,255,255,0.7); 
    --con: #70947A; 
    --warn: #A9803F; 
    --err: #D9534F; 
    --radius: 24px; 
    --radius-sm: 16px; 
    --font-display: 'Fraunces', serif; 
    --font-body: 'Inter', sans-serif; 
    --font-mono: 'IBM Plex Mono', monospace; 
    --accent: var(--con); 
    --glass-bg: rgba(15,15,20,0.35); 
    --glass-border: rgba(255,255,255,0.18); 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); padding-bottom: 140px; }
  
  .os-wallpaper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: #08080C; overflow: hidden; pointer-events: none; }
  .os-blob { position: absolute; filter: blur(90px); border-radius: 50%; opacity: 0.7; animation: floatBlob 25s infinite alternate; }
  .blob-1 { width: 60vw; height: 60vh; background: var(--accent); top: -10%; left: -10%; }
  .blob-2 { width: 50vw; height: 50vh; background: #1a364a; bottom: -10%; right: -10%; animation-delay: -7s; }
  @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(15vw, 15vh) scale(1.2); } }

  .floating-pill { background: rgba(20,20,25,0.5); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px); border: 1px solid var(--glass-border); border-radius: 50px; padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 14px auto 24px; }
  main { padding: 0 20px 40px; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 32px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 20px 50px rgba(0,0,0,0.5); }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .card-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .field-label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }

  input[type="text"], input[type="password"], textarea { appearance: none; font-family: var(--font-body); font-size: 14px; color: var(--ink); background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 14px 18px; width: 100%; transition: 0.3s; margin-bottom:16px;}
  input:focus, textarea:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.6); }
  input[type="color"] { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 2px; height: 38px; width: 48px; margin-bottom:16px; cursor: pointer; }
  
  .btn-primary { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(220,220,220,0.85)); color: #000; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; width: 100%; }
  .btn-secondary { background: rgba(255,255,255,0.05); color: var(--ink); border: 1px solid rgba(255,255,255,0.2); padding: 12px 18px; border-radius: 12px; font-size: 13px; cursor: pointer; }
  
  .toggle-row { display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:16px; border-radius:12px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.05); }
  .toggle-switch { appearance: none; width: 44px; height: 24px; background: rgba(255,255,255,0.2); border-radius: 24px; position: relative; cursor: pointer; outline: none; transition: 0.3s; }
  .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s; }
  .toggle-switch:checked { background: var(--accent); }
  .toggle-switch:checked::after { transform: translateX(20px); }
</style>
</head>
<body>

  <div class="os-wallpaper"><div class="os-blob blob-1"></div><div class="os-blob blob-2"></div></div>
  <div class="floating-header-wrapper"><header class="floating-pill"><div style="display:flex; align-items:center; gap:10px;"><h1 style="font-family:var(--font-display); font-size:18px;">Admin Studio</h1></div><a href="lair.html" style="color:var(--ink-soft); font-size:13px; font-weight:500;">← Back to Lair</a></header></div>

  <main>
    <section class="card">
      <div class="card-head"><h2>OS Control & Features</h2></div>
      <label class="field-label">Broadcast Banner (Lair OS)</label>
      <input type="text" id="edit-broadcast" placeholder="e.g. Server maintenance tonight at 2AM">
      
      <label class="field-label" style="margin-top:16px;">Kill Switches</label>
      <div class="toggle-row"><span>Bookshelf Module</span><input type="checkbox" id="toggle-bookshelf" class="toggle-switch"></div>
      <div class="toggle-row"><span>Voice Room</span><input type="checkbox" id="toggle-voice" class="toggle-switch"></div>
      <div class="toggle-row"><span>Flight Radar</span><input type="checkbox" id="toggle-radar" class="toggle-switch"></div>
      <button class="btn-primary" id="btn-save-os">Update OS Controls</button>
    </section>

    <section class="card">
      <div class="card-head"><h2>Public Identity & Socials</h2></div>
      <label class="field-label">Hero Title</label><input type="text" id="edit-hero-title">
      <label class="field-label">Hero Subtitle</label><textarea id="edit-hero-sub" rows="2"></textarea>
      <label class="field-label">Public Bio</label><textarea id="edit-bio" rows="4"></textarea>
      <label class="field-label">Contact Email</label><input type="text" id="edit-email">
      
      <label class="field-label" style="margin-top:16px; color:var(--con);">Social Links (Leave blank to hide)</label>
      <input type="text" id="edit-social-ig" placeholder="Instagram URL">
      <input type="text" id="edit-social-x" placeholder="X (Twitter) URL">
      <input type="text" id="edit-social-git" placeholder="GitHub URL">
      <button class="btn-primary" id="btn-save-profile">Publish Identity Updates</button>
    </section>

    <section class="card">
      <div class="card-head"><h2>Global Aesthetics</h2></div>
      <label class="field-label">Primary Display Font (Google Fonts)</label><input type="text" id="config-font-display">
      <label class="field-label">Body Font (Google Fonts)</label><input type="text" id="config-font-body">
      <label class="field-label">Primary Accent Color</label><input type="color" id="config-accent">
      <button class="btn-primary" id="btn-save-config">Apply Aesthetics</button>
    </section>

    <section class="card" style="border-color:rgba(217,83,79,0.3);">
      <div class="card-head"><h2 style="color:var(--err);">Security & Authentication</h2></div>
      <label class="field-label">New Master Passkey</label>
      <input type="password" id="edit-password" placeholder="Enter new password (min 6 characters)">
      <button class="btn-primary" id="btn-update-password" style="background:rgba(217,83,79,0.2); color:var(--err);">Update Password</button>
      <p id="pwd-msg" style="font-size:12px; margin-top:12px; display:none;"></p>
    </section>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { initializeFirestore, persistentLocalCache, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app); 
  const db = initializeFirestore(app, { localCache: persistentLocalCache() });

  onAuthStateChanged(auth, (user) => { 
    if (!user) window.location.replace("index.html"); 
    
    onSnapshot(doc(db, 'system', 'config'), (snap) => {
      if(snap.exists() && document.activeElement.tagName !== "INPUT") {
        const d = snap.data();
        if(d.accentColor) { 
          document.getElementById('config-accent').value = d.accentColor; 
          document.documentElement.style.setProperty('--accent', d.accentColor); 
          document.querySelector('.blob-1').style.background = d.accentColor;
        }
        if(d.fontDisplay) document.getElementById('config-font-display').value = d.fontDisplay;
        if(d.fontBody) document.getElementById('config-font-body').value = d.fontBody;
        if(d.broadcast) document.getElementById('edit-broadcast').value = d.broadcast;
        if(d.features) {
            document.getElementById('toggle-bookshelf').checked = d.features.bookshelf !== false;
            document.getElementById('toggle-voice').checked = d.features.voice !== false;
            document.getElementById('toggle-radar').checked = d.features.radar !== false;
        }
      }
    });

    onSnapshot(doc(db, 'system', 'profile'), (snap) => {
      if(snap.exists() && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
        const d = snap.data();
        document.getElementById('edit-hero-title').value = d.heroTitle || ''; 
        document.getElementById('edit-hero-sub').value = d.heroSub || '';
        document.getElementById('edit-bio').value = d.bio || ''; 
        document.getElementById('edit-email').value = d.email || '';
        document.getElementById('edit-social-ig').value = d.socials?.ig || ''; 
        document.getElementById('edit-social-x').value = d.socials?.x || ''; 
        document.getElementById('edit-social-git').value = d.socials?.git || '';
      }
    });
  });

  document.getElementById('btn-save-os').addEventListener('click', async () => {
    const broadcast = document.getElementById('edit-broadcast').value;
    const features = { 
      bookshelf: document.getElementById('toggle-bookshelf').checked, 
      voice: document.getElementById('toggle-voice').checked, 
      radar: document.getElementById('toggle-radar').checked 
    };
    await setDoc(doc(db, 'system', 'config'), { broadcast, features }, { merge: true }); 
    alert('OS Controls Updated');
  });

  document.getElementById('btn-save-profile').addEventListener('click', async () => {
    const data = {
      heroTitle: document.getElementById('edit-hero-title').value, 
      heroSub: document.getElementById('edit-hero-sub').value,
      bio: document.getElementById('edit-bio').value, 
      email: document.getElementById('edit-email').value,
      socials: { 
        ig: document.getElementById('edit-social-ig').value, 
        x: document.getElementById('edit-social-x').value, 
        git: document.getElementById('edit-social-git').value 
      }
    };
    await setDoc(doc(db, 'system', 'profile'), data, { merge: true }); 
    alert('Identity Published');
  });

  document.getElementById('btn-save-config').addEventListener('click', async () => {
    await setDoc(doc(db, 'system', 'config'), { 
      fontDisplay: document.getElementById('config-font-display').value.trim(), 
      fontBody: document.getElementById('config-font-body').value.trim(), 
      accentColor: document.getElementById('config-accent').value 
    }, { merge: true }); 
    alert('Aesthetics Applied');
  });

  document.getElementById('btn-update-password').addEventListener('click', async () => {
    const newPwd = document.getElementById('edit-password').value; 
    const msg = document.getElementById('pwd-msg');
    if(newPwd.length < 6) { 
      msg.textContent = "Must be at least 6 characters."; 
      msg.style.color = "var(--err)"; 
      msg.style.display = "block"; 
      return; 
    }
    try { 
      await updatePassword(auth.currentUser, newPwd); 
      msg.textContent = "Password updated successfully."; 
      msg.style.color = "var(--con)"; 
      msg.style.display = "block"; 
      document.getElementById('edit-password').value = ''; 
    } catch(e) { 
      msg.textContent = "Error: Please sign out and sign back in to update password."; 
      msg.style.color = "var(--err)"; 
      msg.style.display = "block"; 
    }
  });
</script>
</body>
</html>
