<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Admin Studio | The Lair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0A0A; --bg-card:#121212; --ink:#EDEDED; --ink-soft:#A3A3A3; --line:#262626; --con:#70947A; --cryeteria:#7A9BC2; --warn:#A9803F; --err:#D9534F; --radius:16px; --radius-sm:10px; --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace; --accent:var(--con); }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); padding-bottom:140px; padding-top:env(safe-area-inset-top); }
  a{ color:inherit; text-decoration:none; cursor:pointer; }
  
  input[type="text"], input[type="password"], select, textarea { appearance:none; font-family:var(--font-body); font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; width:100%; transition:border-color 0.2s; }
  input[type="file"] { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  input[type="file"]::-webkit-file-upload-button { background: var(--ink); color: var(--bg); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-weight: 500; margin-right: 12px; transition: opacity 0.2s; }
  input[type="color"] { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:2px; height:38px; width:48px; cursor:pointer;}
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); max-width:1040px; margin:0 auto; background:var(--bg); position: sticky; top: 0; z-index: 10; }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-name{font-family:var(--font-display); font-size:20px; font-weight:600;}
  
  .btn-primary{ background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; cursor:pointer; border:none; transition:transform 0.15s; width:100%;}
  .btn-secondary{ background:var(--bg); color:var(--ink); border: 1px solid var(--line); padding:12px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; cursor:pointer;}
  .btn-warn{ background:rgba(217,83,79,0.1); color:var(--err); border: 1px solid rgba(217,83,79,0.3); padding:8px 14px; border-radius:8px; font-size:11px; cursor:pointer; }
  .btn-primary:active, .btn-warn:active { transform: scale(0.96); }

  main{padding:20px 20px 40px; max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}
  .card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .card-head h2{font-family:var(--font-display); font-size:18px; font-weight:600;}
  .field-label{display:block; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; letter-spacing:0.05em;}
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="10" cy="13" r="8" fill="#70947A" opacity="0.85"/><circle cx="16" cy="13" r="8" fill="#7A9BC2" opacity="0.85" style="mix-blend-mode:screen"/></svg>
      <span class="brand-name">The Lair CMS</span>
    </div>
    <div style="display:flex; gap:20px; font-size:14px; font-weight:500;">
      <a href="lair.html" style="color:var(--ink-soft);">Back to Lair</a>
      <a style="color:var(--warn);">Admin Studio</a>
    </div>
  </header>

  <main>
    <!-- Portfolio Upload Studio -->
    <section class="card">
      <div class="card-head"><h2 style="color:var(--accent);">Portfolio Upload Studio</h2></div>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div><label class="field-label">Select Photo (WebP/JPEG)</label><input type="file" id="upload-photo-file" accept="image/*"></div>
        <div><label class="field-label">Title</label><input type="text" id="upload-photo-title" placeholder="e.g. Monolith Shadows"></div>
        <div><label class="field-label">EXIF Data</label><input type="text" id="upload-photo-exif" placeholder="e.g. ISO 100 • 35mm • f/2.8"></div>
        <div><label class="field-label">Accent Glow</label><input type="color" id="upload-photo-accent" value="#70947A"></div>
        <button class="btn-primary" id="btn-upload-photo">Upload to Cloudflare & Publish</button>
        <p id="upload-status" style="font-family:var(--font-mono); font-size:11px; text-align:center; display:none;"></p>
      </div>
    </section>

    <!-- Public Bio & Resume Editor -->
    <section class="card">
      <div class="card-head"><h2>Public Resume & Profile</h2></div>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div><label class="field-label">Public Bio</label><textarea id="edit-bio" rows="4" placeholder="Multidisciplinary creator..."></textarea></div>
        <div><label class="field-label">Contact Email</label><input type="text" id="edit-email" placeholder="theibadhasan@gmail.com"></div>
        
        <!-- Simplified timeline editor: We just use a JSON string field for quick array editing -->
        <div><label class="field-label">Timeline Records (JSON Format)</label><textarea id="edit-timeline" rows="6" placeholder='[{"date":"2024", "title":"Lead", "desc":"..."}, ...]' font-family="monospace"></textarea></div>
        
        <button class="btn-primary" id="btn-save-profile">Update Public Profile</button>
        <p id="profile-status" style="font-family:var(--font-mono); font-size:11px; text-align:center; display:none;"></p>
      </div>
    </section>

    <!-- Gallery Manager -->
    <section class="card">
      <div class="card-head"><h2>Manage Live Gallery</h2></div>
      <div id="admin-portfolio-list" style="display:flex; flex-direction:column; gap:10px;">
         <p style="color:var(--ink-soft); font-size:13px;">Loading portfolio...</p>
      </div>
    </section>

    <!-- System Configs -->
    <section class="card">
      <div class="card-head"><h2 style="color:var(--warn);">System Configuration</h2></div>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div><label class="field-label">Primary Accent Color</label><input type="color" id="admin-accent-color" value="#70947A"></div>
        <button class="btn-primary" id="btn-save-admin">Save Global Config</button>
      </div>
    </section>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, collection, onSnapshot, query, orderBy, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const WORKER_URL = "https://portfolio-uploader.theibadhasan.workers.dev/";
  const PUBLIC_R2_URL = "https://pub-3a5505322c50496598874826433f7e72.r2.dev/";

  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => { if (!user) window.location.replace("index.html"); else initAdmin(); });

  function initAdmin() {
    // Gallery Manager Sync
    onSnapshot(query(collection(db, 'portfolio'), orderBy('timestamp', 'desc')), (snap) => {
      const adminList = document.getElementById('admin-portfolio-list');
      if (snap.empty) { adminList.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">No photos published yet.</p>'; return; }
      adminList.innerHTML = '';
      snap.forEach(docSnap => {
        const p = docSnap.data();
        adminList.innerHTML += `
          <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg); padding:10px; border-radius:8px; border:1px solid var(--line);">
            <div style="display:flex; align-items:center; gap:12px;">
                <img src="${p.imgUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
                <div><p style="font-size:13px; font-weight:500;">${p.title}</p><p style="font-size:10px; color:var(--ink-soft); font-family:var(--font-mono);">${p.exif || 'No EXIF data'}</p></div>
            </div>
            <button class="btn-warn btn-delete-photo" data-id="${docSnap.id}">Remove</button>
          </div>`;
      });
    });

    // Load existing profile
    onSnapshot(doc(db, 'system', 'profile'), (snap) => {
      if(snap.exists() && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
        const d = snap.data();
        document.getElementById('edit-bio').value = d.bio || '';
        document.getElementById('edit-email').value = d.email || '';
        document.getElementById('edit-timeline').value = d.timeline ? JSON.stringify(d.timeline, null, 2) : '[]';
      }
    });
  }

  // Delete Photo
  document.getElementById('admin-portfolio-list').addEventListener('click', async (e) => {
    if (e.target.classList.contains('btn-delete-photo')) {
      if(confirm("Remove this photo from the public portfolio?")) await deleteDoc(doc(db, 'portfolio', e.target.getAttribute('data-id')));
    }
  });

  // Upload Engine
  document.getElementById('btn-upload-photo').addEventListener('click', async () => {
    const fileInput = document.getElementById('upload-photo-file');
    const title = document.getElementById('upload-photo-title').value.trim();
    const exif = document.getElementById('upload-photo-exif').value.trim();
    const accent = document.getElementById('upload-photo-accent').value;
    const statusText = document.getElementById('upload-status');

    if (!fileInput.files.length || !title) { alert("Select an image and provide a title."); return; }
    
    const file = fileInput.files[0];
    const uniqueFileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
    
    statusText.style.display = 'block'; statusText.style.color = 'var(--ink-soft)'; statusText.textContent = 'Uploading to Cloudflare R2...';

    try {
      const uploadRes = await fetch(WORKER_URL, { method: 'POST', headers: { 'X-Lair-Auth': 'lair-master-key-2026', 'X-File-Name': uniqueFileName }, body: file });
      if (!uploadRes.ok) throw new Error('Cloudflare rejected the upload.');

      statusText.textContent = 'Saving entry to database...';
      const finalImgUrl = `${PUBLIC_R2_URL}${uniqueFileName}`;
      
      await setDoc(doc(collection(db, 'portfolio')), { title, exif, accent, imgUrl: finalImgUrl, timestamp: serverTimestamp() });

      statusText.style.color = 'var(--con)'; statusText.textContent = 'Successfully published!';
      fileInput.value = ''; document.getElementById('upload-photo-title').value = ''; document.getElementById('upload-photo-exif').value = '';
      setTimeout(() => { statusText.style.display = 'none'; }, 4000);
    } catch (err) { statusText.style.color = 'var(--err)'; statusText.textContent = `Error: ${err.message}`; }
  });

  // Save Profile
  document.getElementById('btn-save-profile').addEventListener('click', async () => {
    const bio = document.getElementById('edit-bio').value;
    const email = document.getElementById('edit-email').value;
    let timeline = [];
    try { timeline = JSON.parse(document.getElementById('edit-timeline').value); } catch(e) { alert("Timeline JSON is invalid. Please fix syntax."); return; }
    
    const statusText = document.getElementById('profile-status');
    statusText.style.display = 'block'; statusText.style.color = 'var(--con)'; statusText.textContent = 'Updating...';
    
    await setDoc(doc(db, 'system', 'profile'), { bio, email, timeline }, { merge: true });
    statusText.textContent = 'Profile Updated ✔';
    setTimeout(() => { statusText.style.display = 'none'; }, 3000);
  });

  // Config
  document.getElementById('btn-save-admin').addEventListener('click', async () => {
    await setDoc(doc(db, 'system', 'config'), { accentColor: document.getElementById('admin-accent-color').value }, { merge: true });
    alert("Config saved!");
  });
</script>
</body>
</html>
