<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin Studio | The Lair</title>
<link id="dynamic-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { 
    --bg: #020203; --ink: #FFFFFF; --ink-soft: rgba(255,255,255,0.65); 
    --con: #70947A; --warn: #A9803F; --err: #D9534F; --accent: var(--con); 
    --radius: 32px; --radius-sm: 22px; 
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace; 
    
    --glass-bg: rgba(10, 10, 15, 0.45); --glass-border: 1px solid rgba(255, 255, 255, 0.08);
    --glass-blur: blur(60px) saturate(200%);
    --glass-glow: inset 0 1px 0px rgba(255,255,255,0.15), 0 25px 50px -12px rgba(0,0,0,0.8);
    --input-bg: rgba(0, 0, 0, 0.35);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); padding-bottom: 140px; overscroll-behavior-y: none;}
  
  .os-wallpaper { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 50%, #0A0A0F 0%, var(--bg) 100%); pointer-events: none;}
  .floating-pill { background: rgba(5,5,8,0.65); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: 50px; padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 14px auto 24px; box-shadow: var(--glass-glow);}
  main { padding: 0 20px 40px; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: var(--radius); padding: 32px; box-shadow: var(--glass-glow); }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .field-label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }

  input[type="text"], input[type="password"], textarea { appearance: none; font-family: var(--font-body); font-size: 14px; color: var(--ink); background: var(--input-bg); border: var(--glass-border); border-radius: var(--radius-sm); padding: 14px 18px; width: 100%; margin-bottom:16px; outline:none;}
  input[type="color"] { background: var(--input-bg); border: var(--glass-border); border-radius: 10px; padding: 2px; height: 38px; width: 48px; margin-bottom:16px; cursor: pointer; }
  
  .btn-primary { background: linear-gradient(180deg, #FFF, #E0E0E0); color: #000; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; border: none; cursor: pointer; width: 100%; box-shadow: inset 0 1px 0 #fff, 0 10px 25px -5px rgba(0,0,0,0.3);}
  
  .toggle-row { display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); padding:16px; border-radius:var(--radius-sm); margin-bottom:12px; border:var(--glass-border); }
  .toggle-switch { appearance: none; width: 44px; height: 24px; background: rgba(128,128,128,0.2); border-radius: 24px; position: relative; cursor: pointer; outline: none; transition: 0.3s; }
  .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s; box-shadow:0 2px 5px rgba(0,0,0,0.3);}
  .toggle-switch:checked { background: var(--accent); }
  .toggle-switch:checked::after { transform: translateX(20px); }
</style>
</head>
<body>

  <div class="os-wallpaper"></div>
  <div class="floating-header-wrapper"><header class="floating-pill"><div style="display:flex; align-items:center; gap:10px;"><h1 style="font-family:var(--font-display); font-size:18px;">Admin Studio</h1></div><a href="lair.html" style="color:var(--ink-soft); font-size:13px; font-weight:500;">← Back to Lair</a></header></div>

  <main>
    <section class="card">
      <div class="card-head"><h2>Notification Matrix</h2></div>
      <p style="font-size:12px; color:var(--ink-soft); margin-bottom:16px;">Configure which Overseer alerts ping your device lock screen.</p>
      <div class="toggle-row"><span>New Public Visitor</span><input type="checkbox" id="notify-visitor" class="toggle-switch"></div>
      <div class="toggle-row"><span>Guest Lounge Entry</span><input type="checkbox" id="notify-guest" class="toggle-switch"></div>
      <div class="toggle-row"><span>Theater Interaction</span><input type="checkbox" id="notify-theater" class="toggle-switch"></div>
      <div class="toggle-row"><span>Relay Message</span><input type="checkbox" id="notify-relay" class="toggle-switch"></div>
      <button class="btn-primary" id="btn-save-notifications" style="margin-top:8px;">Update Matrix</button>
    </section>

    <section class="card">
      <div class="card-head"><h2>Public Identity & Aesthetics</h2></div>
      <label class="field-label">Hero Title</label><input type="text" id="edit-hero-title">
      <label class="field-label">Primary Accent Color</label><input type="color" id="config-accent">
      <button class="btn-primary" id="btn-save-profile">Publish Updates</button>
    </section>
  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app); 
  const db = getFirestore(app);
  
  onAuthStateChanged(auth, (user) => { 
    if (!user) window.location.replace("index.html"); 
    
    onSnapshot(doc(db, 'system', 'notifications'), (snap) => {
      if(snap.exists()) {
        const d = snap.data();
        document.getElementById('notify-visitor').checked = d.visitor !== false;
        document.getElementById('notify-guest').checked = d.guest !== false;
        document.getElementById('notify-theater').checked = d.theater !== false;
        document.getElementById('notify-relay').checked = d.relay !== false;
      }
    });

    onSnapshot(doc(db, 'system', 'config'), (snap) => {
      if(snap.exists() && snap.data().accentColor) document.getElementById('config-accent').value = snap.data().accentColor;
    });

    onSnapshot(doc(db, 'system', 'profile'), (snap) => {
      if(snap.exists() && document.activeElement.tagName !== "INPUT") {
        document.getElementById('edit-hero-title').value = snap.data().heroTitle || ''; 
      }
    });
  });

  document.getElementById('btn-save-notifications').addEventListener('click', async () => {
    await setDoc(doc(db, 'system', 'notifications'), { 
      visitor: document.getElementById('notify-visitor').checked,
      guest: document.getElementById('notify-guest').checked,
      theater: document.getElementById('notify-theater').checked,
      relay: document.getElementById('notify-relay').checked
    }, { merge: true }); 
    alert('Matrix Updated');
  });

  document.getElementById('btn-save-profile').addEventListener('click', async () => {
    await setDoc(doc(db, 'system', 'profile'), { heroTitle: document.getElementById('edit-hero-title').value }, { merge: true });
    await setDoc(doc(db, 'system', 'config'), { accentColor: document.getElementById('config-accent').value }, { merge: true });
    alert('Published');
  });
</script>
</body>
</html>
