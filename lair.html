<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Lair OS</title>
<link id="dynamic-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

<style>
  :root { 
    --con: #70947A; --accent: var(--con); --warn: #A9803F; --err: #D9534F;
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace; 
    --radius: 32px; --radius-sm: 22px; 
    
    --bg: #020203; --ink: #FFFFFF; --ink-soft: rgba(255,255,255,0.65); 
    --glass-bg: rgba(10, 10, 15, 0.45); --glass-nav: rgba(5, 5, 8, 0.65);
    --glass-border: 1px solid rgba(255, 255, 255, 0.08);
    --glass-blur: blur(60px) saturate(200%);
    --glass-glow: inset 0 1px 0px rgba(255,255,255,0.15), 0 25px 50px -12px rgba(0,0,0,0.8);
    --input-bg: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); padding-top: env(safe-area-inset-top, 0px); padding-bottom: 140px; overscroll-behavior-y: none; }
  a { color:inherit; text-decoration:none; cursor:pointer; } 
  button { font-family:inherit; border:none; background:none; cursor:pointer; outline:none; }
  
  .os-wallpaper { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 50%, #0A0A0F 0%, var(--bg) 100%); pointer-events: none; }
  
  .os-menubar { position: fixed; top: 0; left: 0; width: 100%; height: calc(48px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); background: var(--glass-nav); backdrop-filter: var(--glass-blur); border-bottom: var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 13px; font-weight: 500; z-index: 900; }
  .sys-dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 10px currentColor; display:inline-block; }

  .os-dock-wrapper { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 0; width: 100%; display: flex; justify-content: center; z-index: 900; pointer-events: none; }
  .os-dock { background: var(--glass-nav); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: 36px; padding: 8px 10px; display: flex; gap: 8px; box-shadow: var(--glass-glow); pointer-events: auto; }
  .dock-app { padding: 10px 22px; border-radius: 26px; color: var(--ink-soft); font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.25s ease; }
  .dock-app.active { background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.2); }

  main { padding: 90px 32px 100px; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: var(--radius); padding: 32px; box-shadow: var(--glass-glow); overflow: hidden; }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .card-head h2 { font-family:var(--font-display); font-size:20px; font-weight:500; }

  input[type="text"], textarea { appearance: none; font-family: var(--font-body); font-size: 14px; color: var(--ink); background: var(--input-bg); border: var(--glass-border); border-radius: var(--radius-sm); padding: 15px 20px; width: 100%; outline: none; }
  
  .btn-primary { background: linear-gradient(180deg, #FFF, #E0E0E0); color: #00; padding: 12px 24px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; box-shadow: inset 0 1px 0 #fff, 0 10px 25px -5px rgba(0,0,0,0.3);}
  .btn-secondary { background: var(--glass-bg); border: var(--glass-border); color: var(--ink); padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight:500; backdrop-filter: var(--glass-blur); }

  .segment-pill { display: inline-flex; background: var(--input-bg); border: var(--glass-border); border-radius: 30px; padding: 4px; margin-bottom: 24px; }
  .seg-btn { padding: 8px 24px; border-radius: 26px; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
  .seg-btn.active { background: var(--ink); color: var(--bg); }
  .vault-timeline { display: none; flex-direction: column; gap: 24px; }
  .vault-timeline.active { display: flex; }

  .radar-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: var(--glass-border); font-size: 13px; }
  .radar-row:last-child { border-bottom: none; }

  .theater-grid { display: grid; grid-template-columns: minmax(0, 7.2fr) minmax(0, 2.8fr); gap: 28px; align-items: start; }
  @media (max-width: 1024px) { .theater-grid { grid-template-columns: 1fr; } }
  .theater-container { width: 100%; max-height: 70vh; aspect-ratio: 16/9; background: #000; border-radius: var(--radius-sm); border: var(--glass-border); position: relative; overflow: hidden; display: block; }
  .theater-container .plyr { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .theater-container video, .theater-container iframe { width: 100% !important; height: 100% !important; object-fit: contain; }

  .view-container { display: none; opacity: 0; } 
  .view-container.active { display: block; animation: smoothFadeIn 0.45s ease forwards; }
  @keyframes smoothFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .modal-overlay { position:fixed; inset:0; background:rgba(5,5,8,0.85); backdrop-filter:var(--glass-blur); display:none; align-items:center; justify-content:center; z-index:1000; padding:24px; }
  .modal-overlay.active { display:flex; }
  #spotlight-search { align-items: flex-start; padding-top: 15vh; }
</style>
</head>
<body data-theme="dark">
  
  <div class="os-wallpaper"></div>

  <nav class="os-menubar" id="top-nav">
    <div style="display:flex; gap:16px; align-items:center;">
      <span style="font-weight:600; display:flex; align-items:center; gap:8px;"><span class="sys-dot" style="color:var(--con);"></span>The Lair</span>
    </div>
    <div style="display:flex; gap:16px; align-items:center;">
        <button id="btn-enable-push" class="btn-secondary" style="padding:4px 12px; font-size:11px;">🔔 Alerts</button>
        <div id="sys-clock" style="font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);">--:--</div>
        <button id="btn-signout" style="color:var(--err); font-size:12px; font-weight:600;">Lock</button>
    </div>
  </nav>

  <div class="os-dock-wrapper">
    <div class="os-dock">
      <div class="dock-app app-link active" data-target="dashboard">Dashboard</div>
      <div class="dock-app app-link" data-target="drop">Vault</div>
      <div class="dock-app app-link" data-target="theater">Theater</div>
      <a href="admin.html" class="dock-app">Settings</a>
    </div>
  </div>

  <main>
    <section id="view-dashboard" class="view-container active">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 24px;">
        <div class="card" style="padding:24px;">
          <h2 style="font-size:14px; font-family:var(--font-mono); text-transform:uppercase; color:var(--ink-soft); margin-bottom:16px;">Universal Relay</h2>
          <textarea id="relay-input" rows="3" placeholder="Sync text across devices..."></textarea>
        </div>
        
        <div class="card" style="padding:24px; display:flex; flex-direction:column;">
          <h2 style="font-size:14px; font-family:var(--font-mono); text-transform:uppercase; color:var(--ink-soft); margin-bottom:16px;">Overseer Feed</h2>
          <div id="radar-feed" style="flex:1; overflow-y:auto; max-height:140px;">
             <p style="font-size:12px; color:var(--ink-soft);">Waiting for telemetry...</p>
          </div>
        </div>
      </div>
      <section class="card">
        <div class="card-head"><h2>Shared Bulletin</h2></div>
        <textarea id="shared-bulletin-input" rows="7" style="line-height:1.6;"></textarea>
      </section>
    </section>

    <section id="view-drop" class="view-container">
      <section class="card" style="margin-bottom:28px; text-align:center;">
        <div class="card-head" style="justify-content:center; margin-bottom:16px;"><h2>Lair Cloud Drive</h2></div>
        <div style="background:var(--input-bg); border-radius:var(--radius-sm); padding:24px;">
          <input type="file" id="vault-photo-input" accept="image/*,video/*,application/pdf" style="display:none;" multiple>
          <button class="btn-secondary" onclick="document.getElementById('vault-photo-input').click()">Upload Local Media</button>
        </div>
      </section>

      <section class="card">
        <div style="display:flex; justify-content:center;">
            <div class="segment-pill">
                <button class="seg-btn active" data-seg="photos">Photography</button>
                <button class="seg-btn" data-seg="videos">Videos</button>
                <button class="seg-btn" data-seg="docs">Documents</button>
            </div>
        </div>
        <div id="timeline-photos" class="vault-timeline active"></div>
        <div id="timeline-videos" class="vault-timeline"></div>
        <div id="timeline-docs" class="vault-timeline"></div>
      </section>
    </section>

    <section id="view-theater" class="view-container">
      <div class="theater-grid">
        <div style="display:flex; flex-direction:column; gap:28px;">
          <section class="card" style="padding:24px;">
            <div class="theater-container" id="theater-frame-box" style="margin-bottom:20px;">
              <div id="theater-player-slot" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-family:var(--font-mono); font-size:13px;">
                  <span id="theater-placeholder-text">Select media from watchlist</span>
              </div>
            </div>
            <div style="display:flex; gap:14px;">
              <input type="text" id="cowatch-url-input" placeholder="Direct Video URL (.mp4 or YouTube)...">
              <button class="btn-primary" id="btn-load-cowatch">Stream</button>
            </div>
          </section>
        </div>

        <section class="card" style="display:flex; flex-direction:column; min-height:420px; padding:24px;">
          <h2 style="font-family:var(--font-display); font-size:20px; margin-bottom:20px;">Live Chat</h2>
          <div id="chat-window" style="flex:1; overflow-y:auto; margin-bottom:16px; font-size:14px; display:flex; flex-direction:column; gap:8px;"></div>
          <div style="display:flex; gap:10px;">
            <input type="text" id="chat-input" placeholder="Write message...">
            <button class="btn-primary" id="btn-send-chat">&rarr;</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="spotlight-search">
    <div style="width: 100%; max-width: 600px; padding: 0 20px;">
        <input type="text" id="spotlight-input" placeholder="Command Lair OS..." style="width: 100%; background: rgba(0,0,0,0.5); border: var(--glass-border); color: var(--ink); font-family: var(--font-body); font-size: 20px; padding: 20px; border-radius: var(--radius-sm); outline: none; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);">
    </div>
  </div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, collection, onSnapshot, query, orderBy, setDoc, addDoc, updateDoc, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const TUNNEL_URL = "https://vault.ibadhasan.com"; 

  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app); 
  const db = getFirestore(app);
  let currentUser = null;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

  document.getElementById('btn-enable-push').addEventListener('click', async () => {
      const permission = await Notification.requestPermission();
      if(permission === 'granted') alert('Push alerts authorized. Matrix ready.');
  });

  async function fetchWithAuth(url, options = {}) {
      if (!auth.currentUser) return fetch(url, options);
      const token = await auth.currentUser.getIdToken();
      const headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
      return fetch(url, { ...options, headers });
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.replace("index.html");
    currentUser = { name: user.email.split('@')[0], id: user.email.split('@')[0] };
    initOS();
  });

  document.getElementById('btn-signout').addEventListener('click', () => signOut(auth));

  document.querySelectorAll('.app-link').forEach(link => {
    link.addEventListener('click', (e) => {
      document.querySelectorAll('.dock-app').forEach(d => d.classList.remove('active')); 
      e.currentTarget.classList.add('active');
      document.querySelectorAll('.view-container').forEach(w => w.classList.remove('active'));
      document.getElementById(`view-${e.currentTarget.getAttribute('data-target')}`).classList.add('active'); 
      window.scrollTo(0,0);
    });
  });

  let touchStartY = 0;
  const spotlight = document.getElementById('spotlight-search');
  document.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY, {passive: true});
  document.addEventListener('touchend', e => {
      if(window.scrollY <= 5 && (e.changedTouches[0].clientY - touchStartY > 70)) {
          spotlight.classList.add('active');
          document.getElementById('spotlight-input').focus();
      }
  });
  spotlight.addEventListener('click', (e) => { if(e.target.id === 'spotlight-search') spotlight.classList.remove('active'); });

  function initOS() {
    setInterval(() => document.getElementById('sys-clock').textContent = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false }), 1000);

    onSnapshot(doc(db, 'system', 'config'), (snap) => {
      if(snap.exists() && snap.data().accentColor) document.documentElement.style.setProperty('--accent', snap.data().accentColor);
    });

    // Overseer Feed Engine
    onSnapshot(query(collection(db, 'radar_logs'), orderBy('timestamp', 'desc'), limit(15)), (snap) => {
        const feed = document.getElementById('radar-feed');
        feed.innerHTML = '';
        snap.forEach(d => {
            const data = d.data();
            const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Just now';
            const statusDot = data.status === 'Active' ? '<span style="color:var(--con);">● Active</span>' : '<span style="color:var(--warn);">● Idle</span>';
            feed.innerHTML += `<div class="radar-row" style="flex-direction:column; align-items:flex-start;">
                <div style="width:100%; display:flex; justify-content:space-between;">
                    <span style="font-weight:600; color:var(--ink);">${data.city}, ${data.country}</span>
                    <span style="font-family:var(--font-mono); color:var(--ink-soft);">${time}</span>
                </div>
                <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-soft); margin-top:4px;">
                    ${data.ip} • ${data.device} • ${statusDot}<br>
                    <span style="color:var(--con);">${data.type}</span>
                </div>
            </div>`;
        });
    });

    const relayIn = document.getElementById('relay-input');
    relayIn.addEventListener('input', () => setDoc(doc(db, 'system', 'relay'), { text: relayIn.value, timestamp: serverTimestamp() }));
    onSnapshot(doc(db, 'system', 'relay'), (snap) => { if(snap.exists() && document.activeElement !== relayIn) relayIn.value = snap.data().text || ''; });
    
    initMediaEngine();
  }

  // Bulletproof Theater Sync
  let theaterPlayer = null; 
  let localActionLock = false; 
  let lockTimer = null;
  const watchPartyDoc = doc(db, 'system', 'watch_party');

  function acquireSyncLock() {
      localActionLock = true;
      clearTimeout(lockTimer);
      lockTimer = setTimeout(() => { localActionLock = false; }, 1500); 
  }

  function loadMediaIntoTheater(url) {
      const slot = document.getElementById('theater-player-slot');
      if(theaterPlayer) theaterPlayer.destroy();
      slot.innerHTML = `<video id="theater-video" playsinline controls crossorigin="anonymous"><source src="${url}" type="video/mp4" /></video>`;
      theaterPlayer = new Plyr('#theater-video', { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
      
      theaterPlayer.on('play', () => { acquireSyncLock(); updateDoc(watchPartyDoc, { isPlaying: true, currentTime: theaterPlayer.currentTime, senderId: currentUser.id }); });
      theaterPlayer.on('pause', () => { acquireSyncLock(); updateDoc(watchPartyDoc, { isPlaying: false, currentTime: theaterPlayer.currentTime, senderId: currentUser.id }); });
      theaterPlayer.on('seeked', () => { acquireSyncLock(); updateDoc(watchPartyDoc, { currentTime: theaterPlayer.currentTime, senderId: currentUser.id }); });
  }

  function initMediaEngine() {
    onSnapshot(watchPartyDoc, (snap) => {
        if(!snap.exists() || !snap.data().url) return;
        const d = snap.data();
        const currentVideo = document.getElementById('theater-video');
        const needsNewPlayer = !theaterPlayer || !currentVideo || (!currentVideo.src && !currentVideo.innerHTML.includes(d.url.match(/([a-zA-Z0-9_-]{11})/)?.[0] || 'NONE'));
        
        if(needsNewPlayer) {
            const placeholder = document.getElementById('theater-placeholder-text');
            if(placeholder) placeholder.style.display = 'none';
            loadMediaIntoTheater(d.url);
            theaterPlayer.on('ready', () => { theaterPlayer.currentTime = d.currentTime || 0; if(d.isPlaying) theaterPlayer.play().catch(()=>{}); });
            return;
        }
        if (!localActionLock && d.senderId !== currentUser.id) {
            if (Math.abs(theaterPlayer.currentTime - d.currentTime) > 2) theaterPlayer.currentTime = d.currentTime;
            if (d.isPlaying && !theaterPlayer.playing) theaterPlayer.play().catch(()=>{});
            if (!d.isPlaying && theaterPlayer.playing) theaterPlayer.pause();
        }
    });

    document.getElementById('btn-load-cowatch').addEventListener('click', async () => {
        const url = document.getElementById('cowatch-url-input').value.trim();
        if(url) await setDoc(watchPartyDoc, { url: url, isPlaying: true, currentTime: 0, senderId: currentUser.id }, { merge: true });
    });
  }

  onSnapshot(query(collection(db, 'chat'), orderBy('timestamp', 'asc')), (snap) => { 
      const cw = document.getElementById('chat-window'); 
      cw.innerHTML = ''; 
      snap.forEach(d => { 
        const msg = d.data(); 
        cw.innerHTML += `<div style="padding:10px 14px; background:${msg.user===currentUser.name ? 'var(--con)' : 'var(--glass-bg)'}; color:#fff; border-radius:18px; align-self:${msg.user===currentUser.name ? 'flex-end' : 'flex-start'}; max-width:80%; word-break:break-word; border:var(--glass-border);">${msg.text}</div>`; 
      }); 
      cw.scrollTop = cw.scrollHeight; 
  });
  document.getElementById('btn-send-chat').addEventListener('click', () => { 
    const t = document.getElementById('chat-input').value.trim(); 
    if(t) { addDoc(collection(db, 'chat'), { user:currentUser.name, text:t, timestamp: serverTimestamp() }); document.getElementById('chat-input').value = ''; } 
  });
</script>
</body>
</html>
