<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Lair OS</title>
<link id="dynamic-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root { 
    --con: #70947A; --accent: var(--con); --err: #D9534F; --warn: #E5A93C;
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace; 
    --radius: 26px; --radius-sm: 16px; 
    
    --bg: #060709; --ink: #FFFFFF; --ink-soft: rgba(255,255,255,0.60); 
    --glass-bg: rgba(255, 255, 255, 0.035); 
    --glass-nav: rgba(10, 11, 15, 0.65);
    --glass-border: 1px solid rgba(255, 255, 255, 0.09);
    --liquid-edge: inset 0 1px 0 0 rgba(255, 255, 255, 0.22);
    --glass-blur: blur(40px) saturate(190%);
    --glass-glow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    --input-bg: rgba(0, 0, 0, 0.35);
    --btn-primary-bg: linear-gradient(180deg, #FFFFFF, #E5E5EA); --btn-primary-text: #000;

    --aurora-1: #15221b;
    --aurora-2: #0c161f;
  }

  [data-theme="light"] {
    --bg: #F2F2F7; --ink: #1C1C1E; --ink-soft: rgba(60, 60, 67, 0.65); 
    --glass-bg: rgba(255, 255, 255, 0.70); --glass-nav: rgba(255, 255, 255, 0.80);
    --glass-border: 1px solid rgba(0, 0, 0, 0.06);
    --liquid-edge: inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
    --glass-glow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 15px 35px -10px rgba(0, 0, 0, 0.12);
    --input-bg: rgba(0, 0, 0, 0.04);
    --btn-primary-bg: linear-gradient(180deg, #1C1C1E, #000); --btn-primary-text: #FFF;
    --aurora-1: #e1eae4;
    --aurora-2: #d4e3eb;
  }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); letter-spacing: -0.01em; padding-top: env(safe-area-inset-top, 0px); padding-bottom: 140px; transition: background 2s ease, color 0.4s ease; overflow-x: hidden; }
  a { color:inherit; text-decoration:none; cursor:pointer; } 
  button { font-family:inherit; border:none; background:none; cursor:pointer; outline:none; }
  
  .os-wallpaper { position: fixed; inset: -20%; z-index: -2; background: radial-gradient(circle at 35% 30%, var(--aurora-1) 0%, transparent 60%), radial-gradient(circle at 75% 70%, var(--aurora-2) 0%, var(--bg) 80%); pointer-events: none; transition: background 3s ease; will-change: transform; }
  
  .os-menubar { position: fixed; top: 0; left: 0; width: 100%; height: calc(60px + env(safe-area-inset-top, 0px)); padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; background: var(--glass-nav); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-bottom: var(--glass-border); box-shadow: var(--liquid-edge); display: flex; align-items: flex-end; justify-content: space-between; padding-left: 28px; padding-right: 28px; font-size: 13px; font-weight: 500; z-index: 900; transition: background 0.4s ease; }
  
  @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(112, 148, 122, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(112, 148, 122, 0); } 100% { box-shadow: 0 0 0 0 rgba(112, 148, 122, 0); } }
  .sys-dot { width: 7px; height: 7px; border-radius: 50%; display:inline-block; transition: 0.3s; }
  .sys-dot.pulse { animation: pulse-dot 2.5s infinite cubic-bezier(0.45, 0, 0.55, 1); }

  #broadcast-banner { display:none; width:100%; background:var(--accent); color:#000; font-family:var(--font-mono); font-size:12px; font-weight:600; text-align:center; padding:10px; z-index:10000; position:fixed; top:0; left:0; box-shadow:0 4px 20px rgba(0,0,0,0.5);}
  #toast-container { position: fixed; bottom: calc(85px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .lair-toast { background: rgba(14, 15, 20, 0.88); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--glass-border); box-shadow: var(--liquid-edge), var(--glass-glow); color: var(--ink); padding: 11px 22px; border-radius: 40px; font-size: 13px; font-weight: 500; animation: toastUp 0.3s forwards; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  @keyframes toastUp { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .lair-toast.success { border-color: rgba(112, 148, 122, 0.4); }
  .lair-toast.error { border-color: rgba(217, 83, 79, 0.4); }

  .os-dock-wrapper { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 0; width: 100%; display: flex; justify-content: center; z-index: 9999; pointer-events: none; }
  .os-dock { background: var(--glass-nav); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: var(--glass-border); box-shadow: var(--liquid-edge), var(--glass-glow); border-radius: 36px; padding: 6px 8px; display: flex; gap: 6px; pointer-events: auto; transition: background 0.4s ease; }
  .dock-app { padding: 9px 20px; border-radius: 26px; color: var(--ink-soft); font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .dock-app.active { background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: 0 6px 16px -3px rgba(0, 0, 0, 0.25); }
  .dock-app:active { transform: scale(0.92); }

  main { padding: 90px 32px 100px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-height: 100vh; position: relative; z-index: 10; }
  
  @keyframes cardSlideUp { from { opacity: 0; transform: translateY(20px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  
  .card { 
    background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); 
    border: var(--glass-border); box-shadow: var(--liquid-edge), var(--glass-glow); border-radius: var(--radius); padding: 30px; 
    overflow: hidden; transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.3s ease;
    animation: cardSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--liquid-edge), 0 30px 60px -10px rgba(0,0,0,0.85); border-color: rgba(255,255,255,0.18); }
  
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .card-head h2 { font-family:var(--font-display); font-size:19px; font-weight:500; }
  
  .view-container { display: none; opacity: 0; } 
  .view-container.active { display: block; animation: cardSlideUp 0.4s forwards; }

</style>
</head>
<body data-theme="dark">
  
  <div class="os-wallpaper" id="diurnal-wallpaper"></div>
  <div id="broadcast-banner"></div>
  <div id="toast-container"></div>

  <nav class="os-menubar" id="top-nav">
    <div style="display:flex; gap:14px; align-items:center;">
      <span style="font-weight:600; display:flex; align-items:center; gap:8px;"><span class="sys-dot pulse" style="color:var(--con);"></span>The Lair</span>
    </div>
    <div style="display:flex; gap:14px; align-items:center;">
        <span style="font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); display:flex; align-items:center;">
            <span id="partner-dot" class="sys-dot" style="color:var(--con); margin-right:6px;"></span><span id="partner-name">System Online</span>
        </span>
    </div>
  </nav>

  <div class="os-dock-wrapper">
    <div class="os-dock">
      <div class="dock-app app-link active haptic-btn" data-target="dashboard">Dashboard</div>
      <div class="dock-app app-link haptic-btn" data-target="work" id="dock-work-link">Work</div>
    </div>
  </div>

  <main id="swipe-zone">
    <!-- DASHBOARD TAB -->
    <section id="view-dashboard" class="view-container active">
      <div class="card" style="padding:22px; display:flex; justify-content:space-around; align-items:center; margin-bottom:20px;">
          <div style="text-align:center;">
              <h3 style="font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Dubai HQ</h3>
              <div id="clock-dxb" style="font-family:var(--font-display); font-size:28px; font-weight:500;">--:--</div>
          </div>
          <div style="width:1px; height:40px; background:var(--glass-border);"></div>
          <div style="text-align:center;">
              <h3 style="font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Pakistan</h3>
              <div id="clock-pkt" style="font-family:var(--font-display); font-size:28px; font-weight:500;">--:--</div>
          </div>
      </div>
    </section>

    <!-- NEW WORK TAB: Auditor Pro Web App Integration -->
    <section id="view-work" class="view-container">
      <div class="card" style="padding: 0; overflow: hidden; height: 85vh; min-height: 700px; display: flex; flex-direction: column;">
        <div style="background: var(--glass-nav); padding: 12px 24px; border-bottom: var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-family: var(--font-display); font-size: 16px; font-weight: 500;">Financial Ledger</h2>
          <div style="display: flex; gap: 8px;">
            <span class="sys-dot pulse" style="color: var(--con);"></span>
            <span style="font-family: var(--font-mono); font-size: 10px; color: var(--con); text-transform: uppercase;">Google Cloud Active</span>
          </div>
        </div>
        
        <!-- DROP YOUR DEPLOYED GOOGLE APPS SCRIPT URL HERE -->
        <iframe 
          src="YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE" 
          style="width: 100%; height: 100%; border: none; flex: 1; background: transparent;"
          allow="clipboard-write">
        </iframe>
        
      </div>
    </section>

  </main>

<script type="module">
  window.addEventListener('error', (e) => {
      if (window.showToast) window.showToast('System Error: ' + e.message, 'error');
  });

  window.showToast = (msg, type = 'info') => {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `lair-toast ${type}`;
    const icon = type === 'success' ? '✔' : type === 'error' ? '✖' : '●';
    toast.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.transition = 'all 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(12px) scale(0.92)';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  };

  const triggerHaptic = () => { 
      if(navigator.vibrate) navigator.vibrate(15);
  };
  document.querySelectorAll('.haptic-btn').forEach(b => b.addEventListener('click', triggerHaptic));

  let touchStartX = 0; let touchStartY = 0;
  const swipeZone = document.getElementById('swipe-zone');
  
  swipeZone.addEventListener('touchstart', e => { 
      touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY;
  }, {passive: true});
  
  swipeZone.addEventListener('touchend', e => {
      if (e.target.closest('iframe')) return; // Ignore swipes over the iframe
      const diffX = touchStartX - e.changedTouches[0].screenX; const diffY = touchStartY - e.changedTouches[0].screenY;
      if (Math.abs(diffY) > Math.abs(diffX)) return;

      const views = ['dashboard', 'work'];
      const activeIdx = views.findIndex(v => document.getElementById(`view-${v}`).classList.contains('active'));
      
      if (diffX > 80 && activeIdx < views.length - 1) { 
          triggerHaptic(); document.querySelector(`.dock-app[data-target="${views[activeIdx+1]}"]`).click();
      } else if (diffX < -80 && activeIdx > 0) {
          triggerHaptic(); document.querySelector(`.dock-app[data-target="${views[activeIdx-1]}"]`).click();
      }
  }, {passive: true});

  function syncEnvironment() {
      try {
          const now = new Date();
          document.getElementById('clock-dxb').textContent = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Dubai', hour:'2-digit', minute:'2-digit', hour12:false });
          document.getElementById('clock-pkt').textContent = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Karachi', hour:'2-digit', minute:'2-digit', hour12:false });
      } catch(e) {}
  }
  setInterval(syncEnvironment, 1000); syncEnvironment();

  document.querySelectorAll('.app-link').forEach(link => {
    link.addEventListener('click', (e) => {
      document.querySelectorAll('.dock-app').forEach(d => d.classList.remove('active')); 
      e.currentTarget.classList.add('active');
      document.querySelectorAll('.view-container').forEach(w => w.classList.remove('active'));
      document.getElementById(`view-${e.currentTarget.getAttribute('data-target')}`).classList.add('active'); 
      window.scrollTo(0,0);
    });
  });

</script>
</body>
</html>
