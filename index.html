<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<title>The Lair — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0A; --bg-card: #121212; --ink: #EDEDED; --ink-soft: #A3A3A3; --line: #262626;
    --con: #70947A; --cryeteria: #7A9BC2; --radius: 16px; --radius-sm: 10px;
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body); display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }
  .login-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:32px; width:100%; max-width:380px; text-align:center;
  }
  .brand-name{ font-family:var(--font-display); font-size:24px; font-weight:600; margin-bottom:8px; }
  .subtitle{ font-size:13px; color:var(--ink-soft); margin-bottom:28px; }
  
  .field-group{ margin-bottom:16px; text-align:left; }
  .field-label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; letter-spacing:0.05em; }
  input[type="text"], input[type="password"] {
    width:100%; font-family:var(--font-body); font-size:14px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; outline:none;
    transition:border-color 0.2s;
  }
  input:focus { border-color:var(--con); }

  .btn-submit{
    width:100%; background:var(--ink); color:var(--bg); border:none;
    border-radius:var(--radius-sm); padding:14px; font-size:14px; font-weight:600; cursor:pointer;
    transition: opacity 0.2s; margin-top: 8px;
  }
  .btn-submit:hover{ opacity:0.85; }
  #error-msg{ font-size:12px; color:#D9534F; margin-top:14px; display:none; }
</style>
</head>
<body>

  <div class="login-card">
    <div style="display:flex; justify-content:center; margin-bottom:14px;">
      <svg width="36" height="36" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="10" cy="13" r="8" fill="#70947A" opacity="0.85"/>
        <circle cx="16" cy="13" r="8" fill="#7A9BC2" opacity="0.85" style="mix-blend-mode:screen"/>
      </svg>
    </div>
    <h1 class="brand-name">The Lair</h1>
    <p class="subtitle">Private Access</p>
    
    <div class="field-group">
      <label class="field-label">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off">
    </div>
    
    <div class="field-group">
      <label class="field-label">Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <button class="btn-submit" id="login-btn">Enter The Lair</button>
    <p id="error-msg">Incorrect username or password.</p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const USERS = {
    "con": { pass: "confusicus", email: "justibadx@gmail.com" },
    "cryeteria": { pass: "cryeteria", email: "theibadhasan@gmail.com" }
  };

  document.getElementById("login-btn").addEventListener("click", async () => {
    const userVal = document.getElementById("username").value.trim().toLowerCase();
    const passVal = document.getElementById("password").value;
    
    if (USERS[userVal] && USERS[userVal].pass === passVal) {
      try {
        // Authenticate directly with Firebase Authentication using mapped email
        await signInWithEmailAndPassword(auth, USERS[userVal].email, passVal);
        window.location.replace("app.html");
      } catch (err) {
        document.getElementById("error-msg").textContent = "Firebase Auth Error: " + err.message;
        document.getElementById("error-msg").style.display = "block";
      }
    } else {
      document.getElementById("error-msg").textContent = "Incorrect username or password.";
      document.getElementById("error-msg").style.display = "block";
    }
  });

  document.getElementById("password").addEventListener("keypress", (e) => {
    if (e.key === 'Enter') document.getElementById("login-btn").click();
  });
</script>
</body>
</html>
