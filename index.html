<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090514">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Ibad Hasan — visuals and archive. Exploring depth and digital spaces.">
<link rel="canonical" href="https://ibadhasan.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ibadhasan.com/">
<meta property="og:title" content="Ibad Hasan — Visuals & Archive">
<meta property="og:description" content="Exploring depth and digital spaces.">
<meta property="og:image" content="https://ibadhasan.com/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<title>Ibad Hasan — Visuals & Archive</title>
<link id="dynamic-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500&family=Inter:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/index.css">
</head>
<body>

  <div class="aurora-mesh"><div class="aurora-orb orb-1"></div><div class="aurora-orb orb-2"></div></div>

  <div class="floating-header-wrapper">
    <header class="floating-pill">
      <div class="pub-brand">
        <svg width="20" height="20" viewBox="0 0 26 26"><circle cx="10" cy="13" r="8" fill="var(--accent)"/><circle cx="16" cy="13" r="8" fill="#7A9BC2" style="mix-blend-mode:screen"/></svg>
        <h1>Ibad Hasan</h1>
      </div>
      <nav class="pub-nav">
        <a data-pubtarget="work" class="pub-nav-link active">Work</a>
        <a data-pubtarget="about" class="pub-nav-link">Identity</a>
        <a data-pubtarget="contact" class="pub-nav-link">Contact</a>
      </nav>
    </header>
  </div>

  <main class="pub-content">
    <section id="pub-view-work" class="view-container active">
      <div class="pub-hero">
          <h2 id="dynamic-hero-title">Visual Archival</h2>
          <p id="dynamic-hero-desc" style="margin-bottom:20px;">Exploring depth and digital spaces.</p>
          <button id="btn-enter-spatial" class="btn-primary" style="max-width: 200px;">Enter Exhibition</button>
      </div>
      
      <div id="visionos-portal" class="portal-window">
        <button id="btn-exit-spatial">Exit Environment</button>
        <div id="spatial-viewport">
          <div id="spatial-cloud"></div>
        </div>
      </div>
    </section>

    <section id="pub-view-about" class="view-container">
      <div class="pub-hero"><h2>Identity & Stack</h2></div>
      <div class="contact-card" style="max-width:800px;">
          <p id="dynamic-bio-text" style="font-size:15px; color:var(--ink); line-height:1.7;">Loading profile data from Lair OS...</p>
      </div>
    </section>

    <section id="pub-view-contact" class="view-container">
      <div class="pub-hero"><h2>Connect & Inquiries</h2></div>
      <div class="contact-grid">
        <a href="" id="contact-email-link" class="contact-card">
          <div><p class="field-label">Direct Email</p><h3 id="contact-email-text" style="font-family:var(--font-display); font-size:18px;">Loading...</h3></div>
        </a>
        <div class="contact-card" style="align-items:center; text-align:center; justify-content:center;">
          <p class="field-label">Native Integration</p>
          <button id="btn-download-vcard" class="btn-primary" style="margin-top:12px; margin-bottom:12px;">Save to Contacts</button>
          <p style="font-family:var(--font-mono); font-size:11px; color:var(--accent);">iOS / Android Supported</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
