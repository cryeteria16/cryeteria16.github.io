<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Ibad Hasan — visuals and archive. Exploring depth and digital spaces.">
<link rel="canonical" href="https://ibadhasan.com/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ibadhasan.com/">
<meta property="og:title" content="Ibad Hasan — Visuals & Archive">
<meta property="og:description" content="Exploring depth and digital spaces.">
<meta property="og:image" content="https://ibadhasan.com/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<title>Ibad Hasan — Visuals & Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/index.css?v=3">
</head>
<body>

<header class="top">
  <a class="brand" href="#top">Ibad Hasan</a>
  <nav>
    <a href="#gallery">Gallery</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <div class="stack" id="hero-stack" aria-hidden="true"></div>
    <h1 class="mega" id="hero-title"><span>Hello, I’m</span><span>Ibad Hasan</span></h1>
    <div class="hero-foot">
      <span>Ibad Hasan</span>
      <span class="hero-sub" id="hero-sub">Exploring depth and digital spaces.</span>
      <span id="hero-year"></span>
    </div>
  </section>

  <section class="gallery" id="gallery">
    <div class="gallery-strip" id="strip" tabindex="0" aria-label="Photographs"></div>
    <div class="gallery-empty" id="gallery-empty" hidden>New work is on its way.</div>
    <div class="arrows">
      <button id="prev" aria-label="Previous">←</button>
      <button id="next" aria-label="Next">→</button>
    </div>
    <div class="section-title"><span class="num" id="gallery-count">00</span><span class="mega-s">Gallery</span></div>
  </section>

  <section class="about" id="about">
    <p class="label">About</p>
    <p class="statement" id="bio">Loading…</p>
  </section>

  <section class="contact" id="contact">
    <p class="label">Contact</p>
    <a class="email" id="email" href="#contact">…</a>
    <button class="plain" id="vcard" type="button">Save to contacts ↓</button>
  </section>
</main>

<footer class="foot"><span>Ibad Hasan</span><span id="foot-year"></span></footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="Close">Close ✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">←</button>
  <img id="lb-img" alt="Photograph by Ibad Hasan">
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next">→</button>
  <span class="lb-cap" id="lb-cap"></span>
</div>

<script type="module" src="js/index.js?v=2"></script>
</body>
</html>
