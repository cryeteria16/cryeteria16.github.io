<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --text: #1C1B19;
    --text-soft: #6B6558;
    --accent: #2A5DB0;
    --border: #E4E1D8;
    --display-font: 'Fraunces', serif;
    --body-font: 'Inter', sans-serif;
    --mono-font: 'IBM Plex Mono', monospace;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 64px 24px 48px;
  }

  header{
    margin-bottom: 48px;
  }

  .eyebrow{
    font-family: var(--mono-font);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1{
    font-family: var(--display-font);
    font-weight: 600;
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.05;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .tagline{
    color: var(--text-soft);
    font-size: 16px;
    margin: 0;
    max-width: 46ch;
  }

  .calendar-box{
    display: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
    background: var(--surface);
  }

  .calendar-label{
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .calendar-box iframe{
    display: block;
    width: 100%;
    height: 480px;
    border: none;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }

  .tracker-box{
    display: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
    background: var(--surface);
  }

  .tracker-body{ padding: 16px; }

  .tracker-form{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .tracker-form input[type=text]{
    flex: 1;
    min-width: 100px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--body-font);
    font-size: 14px;
    background: transparent;
    color: var(--text);
  }

  .tracker-name-input{ max-width: 110px; flex: 0 0 110px !important; }

  .tracker-form select{
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--body-font);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }

  .tracker-form button{
    padding: 9px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .tracker-list{ display: flex; flex-direction: column; gap: 8px; }

  .tracker-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
  }

  .tracker-item-main{ display: flex; align-items: center; gap: 10px; min-width: 0; }
  .tracker-item-main span:last-child{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tracker-item-status{
    font-family: var(--mono-font);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--accent);
    color: #fff;
    flex-shrink: 0;
  }
  .tracker-item-status.watched{ background: var(--text-soft); }

  .tracker-item-by{
    font-family: var(--mono-font);
    font-size: 11px;
    color: var(--text-soft);
    flex-shrink: 0;
  }

  .tracker-item-remove{
    background: none;
    border: none;
    color: var(--text-soft);
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .tracker-item-remove:hover{ color: #C0442E; }

  .tracker-empty{ color: var(--text-soft); font-size: 13px; padding: 6px 0; }

  .card{
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 18px 20px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    overflow: hidden;
  }

  .card::before{
    content: attr(data-tag);
    position: absolute;
    top: 0;
    left: 18px;
    font-family: var(--mono-font);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    padding: 3px 8px 4px;
    border-radius: 0 0 6px 6px;
  }

  .card:hover{
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.25);
  }

  .card:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .card-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 14px;
  }

  .icon{
    font-size: 22px;
    line-height: 1;
  }

  .card-label{
    font-family: var(--display-font);
    font-weight: 600;
    font-size: 18px;
    line-height: 1.25;
  }

  .empty{
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    color: var(--text-soft);
    font-size: 14px;
  }

  footer{
    margin-top: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono-font);
    font-size: 11px;
    color: var(--text-soft);
    letter-spacing: 0.02em;
  }

  footer a{
    color: var(--text-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1px;
  }
  footer a:hover{ color: var(--accent); border-color: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow" id="eyebrow">Home Base</p>
      <h1 id="title">Loading…</h1>
      <p class="tagline" id="tagline"></p>
    </header>

    <div class="calendar-box" id="calendar-box">
      <p class="calendar-label">Shared Calendar</p>
      <iframe id="calendar-iframe" src="" loading="lazy" title="Shared calendar"></iframe>
    </div>

    <div class="tracker-box" id="movies-box">
      <p class="calendar-label">Movies &amp; Shows</p>
      <div class="tracker-body">
        <form id="movie-form" class="tracker-form">
          <input type="text" id="movie-name-input" placeholder="Your name" class="tracker-name-input">
          <input type="text" id="movie-title-input" placeholder="Title" required>
          <select id="movie-status-input">
            <option value="watchlist">Want to watch</option>
            <option value="watched">Watched</option>
          </select>
          <button type="submit">Add</button>
        </form>
        <div id="movie-list" class="tracker-list"></div>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <footer>
      <span id="updated"></span>
    </footer>
  </div>

<script>
  const FONT_PRESETS = {
    editorial: { display: "'Fraunces', serif", body: "'Inter', sans-serif" },
    mono:      { display: "'Space Grotesk', sans-serif", body: "'IBM Plex Mono', monospace" },
    clean:     { display: "'Public Sans', sans-serif", body: "'Public Sans', sans-serif" }
  };

  const MODES = {
    light: { bg:"#FAF9F6", surface:"#FFFFFF", text:"#1C1B19", textSoft:"#6B6558", border:"#E4E1D8" },
    dark:  { bg:"#14171C", surface:"#1C2027", text:"#F1EEE6", textSoft:"#9A968C", border:"#2A2E36" }
  };

  function applyTheme(theme){
    const root = document.documentElement.style;
    const mode = MODES[theme.mode] || MODES.light;
    const fonts = FONT_PRESETS[theme.font] || FONT_PRESETS.editorial;
    root.setProperty('--bg', mode.bg);
    root.setProperty('--surface', mode.surface);
    root.setProperty('--text', mode.text);
    root.setProperty('--text-soft', mode.textSoft);
    root.setProperty('--border', mode.border);
    root.setProperty('--accent', theme.accent || '#2A5DB0');
    root.setProperty('--display-font', fonts.display);
    root.setProperty('--body-font', fonts.body);
  }

  function renderLinks(links){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if(!links || links.length === 0){
      grid.innerHTML = '<div class="empty">No links yet — add some from the admin page.</div>';
      return;
    }
    links.forEach(link => {
      const a = document.createElement('a');
      a.href = link.url;
      a.className = 'card';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('data-tag', link.tag || '');
      a.innerHTML = `
        <div class="card-top">
          <span class="icon">${link.icon || '🔗'}</span>
        </div>
        <span class="card-label">${link.label || 'Untitled'}</span>
      `;
      grid.appendChild(a);
    });
  }

  function renderCalendar(cal){
    const box = document.getElementById('calendar-box');
    const iframe = document.getElementById('calendar-iframe');
    if(cal && cal.enabled && cal.embedUrl){
      iframe.src = cal.embedUrl;
      box.style.display = 'block';
    }else{
      box.style.display = 'none';
      iframe.src = '';
    }
  }

  function formatUpdated(iso){
    if(!iso) return '';
    try{
      const d = new Date(iso);
      return 'Updated ' + d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    }catch(e){ return ''; }
  }

  // ---------- shared movies & shows tracker (Firebase Firestore) ----------
  let db = null;

  function escapeHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }

  function initFirebase(fbConfig){
    if(!fbConfig || !fbConfig.apiKey || !fbConfig.projectId) return;
    try{
      firebase.initializeApp(fbConfig);
      firebase.auth().signInAnonymously().catch(err => console.error('Anonymous sign-in failed', err));
      db = firebase.firestore();
      document.getElementById('movies-box').style.display = 'block';
      listenMovies();
    }catch(e){
      console.error('Firebase init failed', e);
    }
  }

  function listenMovies(){
    db.collection('movies').orderBy('createdAt', 'desc').onSnapshot(snap => {
      const list = document.getElementById('movie-list');
      list.innerHTML = '';
      if(snap.empty){
        list.innerHTML = '<div class="tracker-empty">Nothing added yet — be the first.</div>';
        return;
      }
      snap.forEach(doc => {
        const d = doc.data();
        const row = document.createElement('div');
        row.className = 'tracker-item';
        row.innerHTML = `
          <div class="tracker-item-main">
            <span class="tracker-item-status ${d.status === 'watched' ? 'watched' : ''}">${d.status === 'watched' ? 'Watched' : 'Watchlist'}</span>
            <span>${escapeHtml(d.title || '')}</span>
          </div>
          <div class="tracker-item-main">
            <span class="tracker-item-by">${escapeHtml(d.addedBy || '')}</span>
            <button class="tracker-item-remove" title="Remove">×</button>
          </div>`;
        row.querySelector('.tracker-item-remove').addEventListener('click', () => {
          db.collection('movies').doc(doc.id).delete().catch(err => console.error('Delete failed', err));
        });
        list.appendChild(row);
      });
    }, err => console.error('Movie list sync failed', err));
  }

  document.getElementById('movie-name-input').value = localStorage.getItem('lifehub_visitor_name') || '';

  document.getElementById('movie-form').addEventListener('submit', e => {
    e.preventDefault();
    if(!db) return;
    const name = document.getElementById('movie-name-input').value.trim() || 'Someone';
    const title = document.getElementById('movie-title-input').value.trim();
    const status = document.getElementById('movie-status-input').value;
    if(!title) return;
    localStorage.setItem('lifehub_visitor_name', name);
    db.collection('movies').add({
      title, status, addedBy: name,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.error('Add failed', err));
    document.getElementById('movie-title-input').value = '';
    document.getElementById('movie-title-input').focus();
  });

  fetch('config.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(cfg => {
      document.getElementById('eyebrow').textContent = 'Home Base';
      document.getElementById('title').textContent = cfg.title || 'Home Base';
      document.getElementById('tagline').textContent = cfg.tagline || '';
      document.getElementById('updated').textContent = formatUpdated(cfg.lastUpdated);
      document.title = cfg.title || 'Home Base';
      applyTheme(cfg.theme || {});
      renderCalendar(cfg.calendar || {});
      renderLinks(cfg.links || []);
      initFirebase(cfg.firebase || null);
    })
    .catch(() => {
      document.getElementById('title').textContent = 'Couldn\'t load config.json';
      document.getElementById('tagline').textContent = 'Make sure config.json is in the same folder as this page.';
    });
</script>
</body>
</html>
