<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0A">
<title>The Lair — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0A; --bg-card: #121212; --ink: #EDEDED; --ink-soft: #A3A3A3; --ink-faint: #525252; --line: #262626;
    --con: #70947A; --cryeteria: #7A9BC2; --radius: 16px; --radius-sm: 10px;
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body); display:flex; flex-direction:column;
    align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }
  .login-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:32px; width:100%; max-width:380px; text-align:center;
  }
  .brand-name{ font-family:var(--font-display); font-size:24px; font-weight:600; margin-bottom:8px; }
  .subtitle{ font-size:13px; color:var(--ink-soft); margin-bottom:28px; }
  .btn-google{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; font-size:14px; font-weight:500; cursor:pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-google:hover{ background:var(--line); }
  #error-msg{ font-size:12px; color:#D9534F; margin-top:16px; display:none; }
</style>
</head>
<body>

  <div class="login-card">
    <div style="display:flex; justify-content:center; margin-bottom:14px;">
      <svg width="36" height="36" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="10" cy="13" r="8" fill="#70947A" opacity="0.85"/>
        <circle cx="16" cy="13" r="8" fill="#7A9BC2" opacity="0.85" style="mix-blend-mode:screen"/>
      </svg>
    </div>
    <h1 class="brand-name">The Lair</h1>
    <p class="subtitle">Restricted Access</p>
    
    <button class="btn-google" id="login-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.6 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 15.8C3.5 19.6 7.4 23 12 23z"/></svg>
      Sign in with Google
    </button>
    <p id="error-msg">Access denied. Unrecognized email.</p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const ALLOWED_EMAILS = ["justibadx@gmail.com", "theibadhasan@gmail.com"];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // If already logged in, skip straight to hub
  onAuthStateChanged(auth, (user) => {
    if (user && ALLOWED_EMAILS.includes(user.email)) {
      window.location.replace("/hub/");
    }
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      if (ALLOWED_EMAILS.includes(result.user.email)) {
        window.location.replace("/hub/");
      } else {
        document.getElementById("error-msg").style.display = "block";
        await auth.signOut();
      }
    } catch (err) {
      console.error(err);
    }
  });
</script>
</body>
</html>
