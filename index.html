<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF6;
    --bg-card:#FFFFFF;
    --ink:#21201C;
    --ink-soft:#6B6862;
    --ink-faint:#A8A49B;
    --line:#E5E2D9;

    --a:#4B6B53;
    --b:#55708F;
    --accent:#4B6B53;

    --err:#9E4B3F;
    --err-soft:#F7EAE8;

    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .shell{width:100%; max-width:380px;}

  .mark{display:flex; justify-content:center; margin-bottom:20px;}

  .head{text-align:center; margin-bottom:28px;}
  .head h1{
    font-family:var(--font-display); font-weight:600;
    font-size:28px; letter-spacing:-0.01em;
  }
  .head p{font-size:14px; color:var(--ink-soft); margin-top:6px;}

  .card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
  }

  .field{margin-bottom:16px;}
  label{
    display:block;
    font-family:var(--font-mono); font-size:11px;
    letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:7px;
  }
  input{
    width:100%;
    font-family:var(--font-body); font-size:15px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  input::placeholder{color:var(--ink-faint);}

  button.submit{
    width:100%;
    font-family:var(--font-body); font-size:15px; font-weight:500;
    color:#fff; background:var(--accent);
    border:none; border-radius:10px;
    padding:13px;
    cursor:pointer;
    margin-top:4px;
    transition:opacity .15s, background .25s;
  }
  button.submit:hover{opacity:.9;}
  button.submit:disabled{opacity:.55; cursor:default;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .msg{
    display:none;
    background:var(--err-soft); color:var(--err);
    font-size:13px; line-height:1.45;
    border-radius:10px; padding:11px 13px;
    margin-bottom:16px;
  }
  .msg.show{display:block;}

  .foot{
    text-align:center; margin-top:20px;
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
  }

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

  <div class="shell">

    <div class="mark">
      <svg width="44" height="44" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="10" cy="13" r="8" fill="#4B6B53" opacity="0.85"/>
        <circle cx="16" cy="13" r="8" fill="#55708F" opacity="0.85" style="mix-blend-mode:multiply"/>
      </svg>
    </div>

    <div class="head">
      <h1>The Lair</h1>
      <p>Sign in to pick up where you left off.</p>
    </div>

    <div class="card">
      <div class="msg" id="msg" role="alert"></div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" placeholder="Con or Cryeteria">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>

      <button class="submit" id="submit">Sign in</button>
    </div>

    <p class="foot">The Lair · two people only</p>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", // Fixed API key
    authDomain: "cryeterialoginpage.firebaseapp.com",
    projectId: "cryeterialoginpage",
    storageBucket: "cryeterialoginpage.firebasestorage.app",
    messagingSenderId: "1012254851251",
    appId: "1:1012254851251:web:8f3d4aa32504922c9ff0c6"
  };

  const USERS = {
    "con":       { email: "justibadx@gmail.com",     name: "Con",       color: "#4B6B53" },
    "cryeteria": { email: "theibadhasan@gmail.com",  name: "Cryeteria", color: "#55708F" }
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const $user = document.getElementById("username");
  const $pass = document.getElementById("password");
  const $btn  = document.getElementById("submit");
  const $msg  = document.getElementById("msg");

  const showError = (text) => {
    $msg.textContent = text;
    $msg.classList.add("show");
  };
  const clearError = () => $msg.classList.remove("show");

  // Tint the form with whoever is signing in
  $user.addEventListener("input", () => {
    const person = USERS[$user.value.trim().toLowerCase()];
    document.documentElement.style.setProperty("--accent", person ? person.color : "#4B6B53");
  });

  // Already signed in? Go straight through.
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.replace("app.html");
  });

  async function signIn(){
    clearError();

    const key = $user.value.trim().toLowerCase();
    const pass = $pass.value;

    if (!key || !pass) {
      showError("Enter both a username and a password.");
      return;
    }

    const person = USERS[key];
    if (!person) {
      showError("That username or password isn't right.");
      return;
    }

    $btn.disabled = true;
    $btn.textContent = "Signing in…";

    try {
      await setPersistence(auth, browserLocalPersistence);
      await signInWithEmailAndPassword(auth, person.email, pass);
      localStorage.setItem("tandem.name", person.name);
      window.location.replace("app.html");
    } catch (err) {
      const code = err.code || "";
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
        showError("That username or password isn't right.");
      } else if (code === "auth/too-many-requests") {
        showError("Too many attempts. Wait a few minutes and try again.");
      } else if (code === "auth/network-request-failed") {
        showError("Can't reach Firebase. Check your connection and try again.");
      } else if (code === "auth/unauthorized-domain") {
        showError("This domain isn't allowlisted in Firebase yet. Add it under Authentication → Settings → Authorized domains.");
      } else if (code === "auth/api-key-not-valid" || code === "auth/invalid-api-key") {
        showError("The Firebase API key in this page is wrong. Recopy it from Project Settings.");
      } else {
        showError("Sign-in failed: " + (err.message || code));
      }
      $btn.disabled = false;
      $btn.textContent = "Sign in";
    }
  }

  $btn.addEventListener("click", signIn);
  [$user, $pass].forEach(el =>
    el.addEventListener("keydown", e => { if (e.key === "Enter") signIn(); })
  );
</script>

</body>
</html>
