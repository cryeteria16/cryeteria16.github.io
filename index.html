<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070709">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Ibad Hasan — Visuals & Archive</title>
<link id="dynamic-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500&family=Inter:wght@300;400;500&display=swap">
<style>
  /* All your existing CSS from index.html remains identical here */
  :root { 
    --bg: #070709; --ink: #FFFFFF; --ink-soft: rgba(255,255,255,0.65); 
    --con: #70947A; --accent: var(--con); 
    --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace; 
    --radius: 28px; --radius-sm: 18px; 
    --glass-bg: rgba(255,255,255,0.03); --glass-border: 1px solid rgba(255,255,255,0.12); 
    --glass-blur: blur(35px) saturate(190%);
    --glass-glow: inset 0 1px 1px rgba(255,255,255,0.3), 0 20px 40px -10px rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.5; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  .aurora-mesh { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #0D0E15 0%, #050507 100%); overflow: hidden; pointer-events: none; }
  .aurora-orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; animation: floatOrb 25s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; }
  .orb-1 { width: 60vw; height: 60vh; background: var(--accent); top: -10%; left: -10%; }
  .orb-2 { width: 50vw; height: 50vh; background: #2b4c59; bottom: -10%; right: -10%; animation-delay: -5s; }
  @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 100% { transform: translate(10vw, 15vh) scale(1.1) rotate(20deg); } }

  .floating-header-wrapper { position: sticky; top: env(safe-area-inset-top, 20px); z-index: 50; padding: 20px; display: flex; justify-content: center; pointer-events: none; }
  .floating-pill { background: rgba(16,16,22,0.6); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: 50px; padding: 10px 24px; display: flex; align-items: center; gap: 32px; box-shadow: var(--glass-glow); pointer-events: auto; }
  .pub-brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .pub-brand h1 { font-family: var(--font-display); font-size: 18px; font-weight: 500; }
  .pub-nav { display: flex; gap: 24px; font-size: 13px; font-family: var(--font-mono); color: var(--ink-soft); }
  .pub-nav a.active { color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

  .pub-content { max-width: 1280px; width: 100%; margin: 0 auto; padding: 20px 32px 80px; min-height: 100vh; }
  .pub-hero { margin-bottom: 56px; max-width: 720px; }
  .pub-hero h2 { font-family: var(--font-display); font-size: 42px; font-weight: 400; margin-bottom: 16px; letter-spacing:-0.02em; }
  .pub-hero p { font-size: 16px; color: var(--ink-soft); }

  .view-container { display: none; opacity: 0; }
  .view-container.active { display: block; animation: smoothFadeIn 0.5s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  @keyframes smoothFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
  .contact-card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: var(--glass-border); border-radius: var(--radius); padding: 32px; transition: 0.4s; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between;}
  .field-label { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  
  .btn-primary { background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(225,225,225,0.9)); color: #000; padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; text-align: center; border: none; cursor: pointer; width: 100%; display:block; box-shadow: inset 0 1px 0 #fff, 0 10px 20px -5px rgba(0,0,0,0.5);}
  .btn-primary:active { transform: scale(0.96); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: var(--glass-blur); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .login-glass-card { background: rgba(16,16,22,0.6); border: var(--glass-border); box-shadow: var(--glass-glow); border-radius: var(--radius); padding: 48px 32px; width: 100%; max-width: 360px; text-align: center; backdrop-filter: var(--glass-blur); }
  .login-glass-card input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--ink); font-family: var(--font-mono); font-size: 14px; text-align: center; padding: 16px; border-radius: 16px; width: 100%; margin-bottom: 12px; outline: none; }
</style>
</head>
<body>

  <div class="aurora-mesh"><div class="aurora-orb orb-1"></div><div class="aurora-orb orb-2"></div></div>

  <div class="floating-header-wrapper">
    <header class="floating-pill">
      <div class="pub-brand" id="brand-secret-trigger" title="Double tap for gateway">
        <svg width="20" height="20" viewBox="0 0 26 26"><circle cx="10" cy="13" r="8" fill="#70947A"/><circle cx="16" cy="13" r="8" fill="#7A9BC2" style="mix-blend-mode:screen"/></svg>
        <h1>Ibad Hasan</h1>
      </div>
      <nav class="pub-nav">
        <a data-pubtarget="work" class="pub-nav-link active">Work</a>
        <a data-pubtarget="about" class="pub-nav-link">Identity</a>
        <a data-pubtarget="contact" class="pub-nav-link">Contact</a>
      </nav>
    </header>
  </div>

  <main class="pub-content">
    <section id="pub-view-work" class="view-container active">
      <div class="pub-hero"><h2 id="dynamic-hero-title">Visual Archival</h2></div>
      <!-- Portfolio Grid omitted for brevity, logic remains identical -->
    </section>

    <section id="pub-view-about" class="view-container">
        <!-- Identity Bio omitted for brevity, logic remains identical -->
    </section>

    <section id="pub-view-contact" class="view-container">
      <div class="pub-hero"><h2>Connect & Inquiries</h2></div>
      <div class="contact-grid">
        <a href="" id="contact-email-link" class="contact-card">
          <div><p class="field-label">Direct Email</p><h3 id="contact-email-text" style="font-family:var(--font-display); font-size:18px;">Loading...</h3></div>
        </a>
        <div class="contact-card" style="align-items:center; text-align:center; justify-content:center;">
          <p class="field-label">Native Integration</p>
          <!-- Zero-Click V-Card Button -->
          <button id="btn-download-vcard" class="btn-primary" style="margin-top:12px; margin-bottom:12px;">Save to Contacts</button>
          <p style="font-family:var(--font-mono); font-size:11px; color:var(--accent);">iOS / Android Supported</p>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal-secret-login">
    <div class="login-glass-card">
      <h2 style="font-family:var(--font-display); font-size:24px; margin-bottom:24px;">Lair Gateway</h2>
      <input type="text" id="login-username" placeholder="IDENTITY" autocomplete="off" spellcheck="false">
      <input type="password" id="login-password" placeholder="PASSKEY">
      <button class="btn-primary" id="btn-do-login" style="margin-top:12px;">Authenticate</button>
      <button id="btn-cancel-login" style="background:transparent; border:none; color:var(--ink-soft); font-size:12px; font-family:var(--font-mono); margin-top:16px; width:100%;">Abort</button>
      <p id="login-error-msg" style="font-size:11px; color:#E65C58; margin-top:16px; display:none;"></p>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyBfRI1hugT-Wy5uJX47LNQU3wjM-VjnaC4", authDomain: "cryeterialoginpage.firebaseapp.com", projectId: "cryeterialoginpage" };
  const app = initializeApp(firebaseConfig); 
  const auth = getAuth(app); 
  const db = getFirestore(app); 
  
  // Google Sheets Telemetry & Firebase Radar Sync
  async function fireSilentRadar(actionType) {
    try {
      const geoRes = await fetch('https://ipapi.co/json/');
      const geo = await geoRes.json();
      const ua = navigator.userAgent;
      let device = /iPhone|iPad|iPod/i.test(ua) ? "iOS Device" : /Android/i.test(ua) ? "Android" : "PC/Mac";

      const payload = {
          type: actionType,
          ip: geo.ip || 'Unknown',
          city: geo.city || 'Unknown',
          country: geo.country_name || 'Unknown',
          device: device,
          timestamp: serverTimestamp()
      };

      // 1. Push to Firebase Lair UI
      await addDoc(collection(db, 'radar_logs'), payload);
      
      // 2. Push to Google Sheets (Replace URL when you create the Web App)
      // fetch('YOUR_GOOGLE_SCRIPT_URL_HERE', { method: 'POST', body: JSON.stringify(payload) });
    } catch(e) {}
  }
  fireSilentRadar('Portfolio View');

  document.querySelectorAll('.pub-nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      document.querySelectorAll('.pub-nav-link').forEach(l => l.classList.remove('active')); 
      e.currentTarget.classList.add('active');
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      document.getElementById(`pub-view-${e.currentTarget.getAttribute('data-pubtarget')}`).classList.add('active'); 
      if(navigator.vibrate) navigator.vibrate(10);
    });
  });

  let vcardData = { name: "Ibad Hasan", phone: "" };

  onSnapshot(doc(db, 'system', 'profile'), (snap) => {
    if(snap.exists()) {
      const d = snap.data();
      if(d.email) { document.getElementById('contact-email-link').href = `mailto:${d.email}`; document.getElementById('contact-email-text').textContent = d.email; }
      if(d.vcardName) vcardData.name = d.vcardName;
      if(d.vcardPhone) vcardData.phone = d.vcardPhone;
    }
  });

  // Zero-Click V-Card Generator
  document.getElementById('btn-download-vcard').addEventListener('click', () => {
      if(navigator.vibrate) navigator.vibrate(15);
      const vcfStr = `BEGIN:VCARD\nVERSION:3.0\nFN:${vcardData.name}\nTEL;TYPE=CELL:${vcardData.phone}\nEND:VCARD`;
      const blob = new Blob([vcfStr], { type: "text/vcard" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${vcardData.name.replace(" ", "_")}.vcf`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
  });

  // Gateway Login Logic
  const sm = document.getElementById('modal-secret-login');
  const brandBtn = document.getElementById('brand-secret-trigger');
  brandBtn.addEventListener('dblclick', () => { sm.classList.add('active'); if(navigator.vibrate) navigator.vibrate(20); });
  document.getElementById('btn-cancel-login').addEventListener('click', () => sm.classList.remove('active'));
  
  document.getElementById('btn-do-login').addEventListener('click', async () => {
    const btn = document.getElementById('btn-do-login'); 
    const usr = document.getElementById('login-username').value.trim().toLowerCase(); 
    const pwd = document.getElementById('login-password').value;
    btn.textContent = "Authenticating...";
    try { 
        const USERS = { "cryeteria": { email: "theibadhasan@gmail.com" } };
        await signInWithEmailAndPassword(auth, USERS[usr]?.email || usr, pwd); 
    } catch(e) { 
        document.getElementById('login-error-msg').style.display='block'; btn.textContent = "Authenticate"; 
        fireSilentRadar('Failed Auth');
    }
  });
  
  onAuthStateChanged(auth, (user) => { if (user) window.location.replace("lair.html"); });
</script>
</body>
</html>
